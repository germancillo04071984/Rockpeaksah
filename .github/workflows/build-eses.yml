name: Build verified Spanish catalog
on:
  push:
    branches: [main]
    paths:
      - 'tools/build-locales.mjs'
      - '.github/workflows/build-eses.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-eses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Spanish items and recipe names in batches of 50
        run: node tools/build-locales.mjs
      - name: Publish verified dictionary
        run: |
          git config user.name "rockpeaks-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add locales/esES.json
          if git diff --cached --quiet; then
            echo "The Spanish dictionary has not changed"
          else
            git commit -m "Publish verified esES item and recipe dictionary"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
