name: Verify Rockpeaks
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and business logic regression tests
        run: node --test tests/rockpeaks.test.mjs
      - name: Check live Blizzard-derived market and recipe endpoints
        env:
          ROCKPEAKS_LIVE: '1'
        run: node --test tests/rockpeaks.test.mjs
      - name: Probe Spanish client data SDK
        run: node tools/probe-sdk.mjs
      - name: Compare client and auction-house recipe identities
        run: node tools/audit-recipe-matches.mjs
      - name: Verify actual published GitHub Pages release and Spanish dictionary
        run: node tools/check-published.mjs

  spanish-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout translation sources
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check untranslated catalogue against latest Forever esES corpus
        run: node tools/audit-locale-gaps.mjs

  lua-client-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Validate addon Lua syntax
        run: luac5.1 -p addons/RockpeaksBridge/RockpeaksBridge.lua tests/addon-lua.lua
      - name: Run simulated WoW client addon checks
        run: lua5.1 tests/addon-lua.lua

  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout web application
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit chromium
      - name: Test iPhone-sized WebKit navigation, recipes, translation, and CSV
        run: node tests/mobile-webkit.mjs
      - name: Test PC automatic character file sync and permission recovery in Chromium
        run: node tests/desktop-chromium.mjs
