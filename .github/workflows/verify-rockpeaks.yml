name: Verify Rockpeaks
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and business logic regression tests
        run: node --test tests/rockpeaks.test.mjs
      - name: Check live Blizzard-derived market and recipe endpoints
        env:
          ROCKPEAKS_LIVE: '1'
        run: node --test tests/rockpeaks.test.mjs
      - name: Probe Spanish client data SDK
        run: node tools/probe-sdk.mjs
      - name: Compare client and auction-house recipe identities
        run: node tools/audit-recipe-matches.mjs
      - name: Match Wowhead Spanish recipes against live Forever material and output signatures
        run: node tools/check-wowhead-recipes.mjs
      - name: Verify actual published GitHub Pages release and Spanish dictionary
        run: node tools/check-published.mjs

  wowhead-item-discovery:
    if: contains(github.event.head_commit.message, '[audit-item-52]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit market material and product item IDs in localized Wowhead tooltips
        run: node tools/audit-missing-items-wowhead.mjs

  wowhead-final-11-probe:
    if: contains(github.event.head_commit.message, '[scan-final-11]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recipe probes
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare remaining 11 names, ingredient lists and quantities in Wowhead
        run: node tools/probe-final-11.mjs

  wowhead-range-discovery:
    if: contains(github.event.head_commit.message, '[scan-wowhead]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover new Wowhead Spanish matches without changing published translations
        env:
          WOWHEAD_SPECIALS: '1'
        run: node tools/scan-wowhead-untranslated.mjs

  wowhead-spanish-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original 25 localized Wowhead recipes against market
        run: node tools/validate-25-wowhead.mjs
      - name: Recheck all 50 latest translated recipes using independent Spanish and English Wowhead tooltips
        run: node tools/recheck-wowhead-50.mjs
      - name: Recheck final 11 Wowhead translations, ingredients, recipe name changes and output counts
        run: node tools/recheck-wowhead-final-11.mjs
      - name: Recheck first 52 translated product and material IDs with Spanish and English Wowhead
        run: node tools/recheck-wowhead-items-52.mjs
      - name: Verify final 52 translated items, market-ID placeholders, and equal-language Jade
        run: node tools/recheck-wowhead-items-final.mjs

  spanish-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout translation sources
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check untranslated catalogue against latest Forever esES corpus
        run: node tools/audit-locale-gaps.mjs

  lua-client-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Validate addon Lua syntax
        run: luac5.1 -p addons/RockpeaksBridge/RockpeaksBridge.lua tests/addon-lua.lua
      - name: Run simulated WoW client addon checks
        run: lua5.1 tests/addon-lua.lua

  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout web application
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit chromium
      - name: Test iPhone-sized WebKit navigation, recipes, translation, and CSV
        run: node tests/mobile-webkit.mjs
      - name: Test PC automatic character file sync and permission recovery in Chromium
        run: node tests/desktop-chromium.mjs
